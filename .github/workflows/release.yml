# v* のタグを push すると、各 OS（x64・arm64）の配布物をビルドして GitHub Releases に載せる。
# Windows / Linux の自動アップデートは asset を探す。変更時は src/update.rs も合わせる。
# macOS は .app の ZIP を手動で更新するため macos_asset で別に指定する。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked

  build:
    name: ${{ matrix.asset || matrix.macos_asset }}
    runs-on: ${{ matrix.os }}
    # arm64 版のビルドが落ちても x64 版だけでリリースする（arm64 機の利用者は、その版では x64 版に更新される）。
    # x64 版が落ちたときはリリースしない。macOS 版は手動で更新するので、落ちても他の OS のリリースは止めない
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: riscord.exe
            asset: riscord-windows-x64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: riscord.exe
            asset: riscord-windows-arm64.exe
            optional: true
          # glibc が古めの環境でビルドして、新しすぎて動かないディストリを減らす
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: riscord
            asset: riscord-linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bin: riscord
            asset: riscord-linux-arm64
            optional: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            macos_asset: riscord-macos-x64.zip
            optional: true
          - os: macos-15
            target: aarch64-apple-darwin
            macos_asset: riscord-macos-arm64.zip
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "タグ $GITHUB_REF_NAME と Cargo.toml の version ($v) が違います"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-22.04 ランナーに入っている libunwind-14-dev が、libgstreamer1.0-dev の依存する libunwind-dev とぶつかるので外す
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        env:
          RISCORD_UPDATE_PUBLIC_KEY: ${{ vars.RISCORD_UPDATE_PUBLIC_KEY }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} out/${{ matrix.asset }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          scripts/package-macos.sh target/${{ matrix.target }}/release/riscord out
          ditto -c -k --sequesterRsrc --keepParent out/Riscord.app out/${{ matrix.macos_asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset || matrix.macos_asset }}
          path: out/${{ matrix.asset || matrix.macos_asset }}
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Sign update assets
        shell: bash
        env:
          RISCORD_UPDATE_PRIVATE_KEY: ${{ secrets.RISCORD_UPDATE_PRIVATE_KEY }}
          RISCORD_UPDATE_PUBLIC_KEY: ${{ vars.RISCORD_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RISCORD_UPDATE_PRIVATE_KEY"
          test -n "$RISCORD_UPDATE_PUBLIC_KEY"
          key_file="$(mktemp)"
          message_file="$(mktemp)"
          trap 'rm -f "$key_file" "$message_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$RISCORD_UPDATE_PRIVATE_KEY" > "$key_file"
          public_key="$(openssl pkey -in "$key_file" -pubout -outform DER | tail -c 32 | xxd -p -c 64)"
          test "$public_key" = "$RISCORD_UPDATE_PUBLIC_KEY"
          for asset in out/riscord-linux-* out/riscord-windows-*; do
            [ -f "$asset" ] || continue
            digest="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            printf 'riscord-update-v1\n%s\n%s\n%s\n' "$GITHUB_REF_NAME" "$(basename "$asset")" "$digest" > "$message_file"
            openssl pkeyutl -sign -rawin -inkey "$key_file" -in "$message_file" -out "$asset.sig"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
