name: Android
on:
  push:
    paths: ['android/**', 'crates/riscord-core/**', 'src/**', 'scripts/build-android-native.sh', 'Cargo.*', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'crates/riscord-core/**', 'src/**', 'scripts/build-android-native.sh', 'Cargo.*', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  # ビルドは secrets を一切持たないジョブで行う。cargo の build script や Gradle のプラグインからは署名鍵が見えない
  apk:
    runs-on: ubuntu-24.04
    env:
      # 利用者向けの release APK を作るのは main への push と v* タグだけ。他のブランチや PR では debug だけ作る
      BUILD_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # stable のままだと実行するたびに違う版でビルドされうるので、具体的な版に固定する（上げるときは全ワークフローで揃える）
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android
      # 署名して配る release を作るときはキャッシュを使わない（他の実行が書いたキャッシュを成果物に混ぜない）
      - if: env.BUILD_RELEASE != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install NDK
        run: |
          # ランナーの sdkmanager は PATH にないので場所を指定する。ANDROID_NDK_HOME は既定版を指すため上書きする
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Core tests
        run: cargo test -p riscord-core --locked
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: riscord-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # 署名鍵の環境変数を渡さないので、Gradle は未署名の release APK（app-release-unsigned.apk）を作る。署名は sign ジョブで行う
      - name: Build unsigned release APK
        if: env.BUILD_RELEASE == 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: riscord-android-arm64-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  # 未署名の release APK に apksigner だけで署名する。署名鍵は environment「android-release」の secrets から読み、
  # このジョブではリポジトリのコードも cargo も Gradle も動かさない
  sign:
    needs: apk
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: riscord-android-arm64-release-unsigned
          path: unsigned
      - name: Install build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      # 署名鍵が未登録（フォークなど）のときは署名を飛ばす。未署名の APK は配らない
      - name: Sign release APK
        id: sign
        env:
          RISCORD_ANDROID_KEYSTORE_BASE64: ${{ secrets.RISCORD_ANDROID_KEYSTORE_BASE64 }}
          RISCORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RISCORD_ANDROID_KEYSTORE_PASSWORD }}
          RISCORD_ANDROID_KEY_ALIAS: ${{ secrets.RISCORD_ANDROID_KEY_ALIAS }}
          RISCORD_ANDROID_KEY_PASSWORD: ${{ secrets.RISCORD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RISCORD_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::署名鍵が登録されていないので、release APK の署名を飛ばします"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$RISCORD_ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          mkdir -p out
          # AGP の出力は整列済みだが、念のため 16KB ページ境界で揃え直してから署名する（署名後に zipalign はできない）
          zipalign -f -P 16 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          # パスワードはコマンドラインに載せず、環境変数から読ませる
          apksigner sign \
            --ks "$keystore" \
            --ks-pass env:RISCORD_ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$RISCORD_ANDROID_KEY_ALIAS" \
            --key-pass env:RISCORD_ANDROID_KEY_PASSWORD \
            --out out/app-release.apk \
            "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose --print-certs out/app-release.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: riscord-android-arm64-release
          path: out/app-release.apk
          if-no-files-found: error
