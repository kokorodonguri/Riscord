[package]
name = "riscord"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI（gpui と gpui-component 一式。gpui-kit が組み合わせの合う版を固定している）
gpui = { package = "gpui-kit", version = "=0.9.0" }
# 別スレッドから UI へ「描き直して」を届ける（src/wake.rs）
futures-channel = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
# raw_value: ゲートウェイの d を使う種類のときだけ解析する（src/net.rs の GatewayFrame）
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
# テーマファイル（src/theme.rs）
toml = { version = "0.8", default-features = false, features = ["parse"] }
dirs = "6"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
velato = { version = "0.12", default-features = false }
vello_cpu = "0.3"
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tungstenite"] }
cpal = "0.18.2"
ringbuf = "0.4"
async-trait = "0.1.92"
symphonia-core = "0.5"
# ゲートウェイの zlib-stream 展開（png 経由で既に依存ツリーにある版を使う）
flate2 = "1.1"
# 画像の貼り付け。Wayland ネイティブのクリップボードにも対応させる
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
# ＋メニューの「ファイルをアップロード」のファイル選択ダイアログ。Linux は xdg-desktop-portal 経由（GTK を直接リンクしない）
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# QR コードでのログイン（src/login.rs）。Remote Auth の鍵は RSA-OAEP(SHA-256)、QR は自前で描くので画像出力は使わない
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
notify-rust = "4"

[profile.release]
lto = "thin"
strip = true

# gpui の wgpu 描画を、draw の first_instance に頼らない形に直したもの（Adreno などで文字や画像が消えるため）。
# 中身は gpui-pre-wgpu 0.3.11 と同じで、src/wgpu_renderer.rs の record_frame だけ変えてある
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# Rust 1.93 より前でもビルドできるよう、slice::as_array を使わない版。
gpui-pre-util = { path = "vendor/gpui-pre-util" }
# Rust 1.95 より前でもビルドできるよう、cold_path のヒントを除いた版。
gpui-pre = { path = "vendor/gpui-pre" }
# Linux から Windows 版をクロスビルドできるよう、fxc.exe がないときはシェーダーを起動時にコンパイルする版。
# Windows 上でのビルドは元と同じく fxc.exe で事前コンパイルする
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
