# プッシュのたびに Windows / Linux（x64・arm64）向けの release ビルドを作り、成果物として保存する
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Format
        if: matrix.name == 'linux-x64'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.name == 'linux-x64'
        run: cargo clippy --locked --all-targets

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscord-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/riscord
            target/${{ matrix.target }}/release/riscord.exe
          if-no-files-found: error
