# プッシュのたびに各 OS（x64・arm64）向けの release ビルドを作り、成果物として保存する
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      # stable のままだと実行するたびに違う版でビルドされうるので、具体的な版に固定する（上げるときは全ワークフローで揃える）
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Format
        if: matrix.name == 'linux-x64'
        run: cargo fmt --all --check

      # [patch.crates-io] の vendor/ 版（特に lua-src）が版ずれで黙って無視されていないか確かめる
      - name: Check vendored patches
        if: matrix.name == 'linux-x64'
        run: scripts/check-vendored-patches.sh

      - name: Clippy
        if: matrix.name == 'linux-x64'
        run: cargo clippy --locked --all-targets --workspace -- -D warnings

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          scripts/package-macos.sh target/${{ matrix.target }}/release/riscord out
          plutil -lint out/Riscord.app/Contents/Info.plist
          codesign --verify --strict out/Riscord.app
          ditto -c -k --sequesterRsrc --keepParent out/Riscord.app out/riscord-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscord-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/riscord
            target/${{ matrix.target }}/release/riscord.exe
            out/riscord-${{ matrix.name }}.zip
          if-no-files-found: error
